apiVersion: v1
kind: ConfigMap
metadata:
  name: atlasfarm-config
  namespace: atlasfarm
data:
  HTTP_ADDR: ":8080"
  RABBITMQ_QUEUE: "jobs"
  SCHEDULER_STRATEGY: "best_fit"
  OTEL_EXPORTER_OTLP_ENDPOINT: "atlasfarm-jaeger:4317"
---
apiVersion: v1
kind: Secret
metadata:
  name: atlasfarm-credentials
  namespace: atlasfarm
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  RABBITMQ_DEFAULT_USER: "atlasfarm"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  DATABASE_DSN: "root:CHANGE_ME@tcp(atlasfarm-mysql:3306)/atlasfarm?parseTime=true"
  RABBITMQ_URL: "amqp://atlasfarm:CHANGE_ME@atlasfarm-rabbitmq:5672/"
