global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: worker-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
