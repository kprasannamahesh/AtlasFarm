openapi: 3.0.3
info:
  title: AtlasFarm Control Plane API
  version: 1.0.0
  description: Job submission, fenced worker lifecycle, and lease APIs.
servers:
  - url: http://localhost:8080
paths:
  /v1/jobs:
    post:
      summary: Create an idempotent job for fair scheduling
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: May be supplied instead of the idempotency_key JSON field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJob'
      responses:
        '201':
          description: Job created and queued
        '200':
          description: Existing idempotent job returned
        '400':
          description: Invalid request
        '429':
          description: Tenant quota exceeded
    get:
      summary: List recent jobs
      responses:
        '200':
          description: Jobs
  /v1/jobs/{job_id}:
    get:
      summary: Get a job projection and chronological event audit trail
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job
        '404':
          description: Job not found
    delete:
      summary: Cancel an active job
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Job cancelled
        '404':
          description: Job not found
        '409':
          description: Job is already terminal
  /v1/jobs/{job_id}/status:
    post:
      summary: Claim a scheduled job or report its terminal outcome with a fencing token
      parameters:
        - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          description: Updated job; a running response includes claimed=true only for the successful claim
        '404':
          description: Job not found
        '409':
          description: Invalid transition or stale execution token
  /v1/workers:
    post:
      summary: Register or refresh worker capacity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Worker'
      responses:
        '201':
          description: Worker registered
    get:
      summary: List registered workers
      responses:
        '200':
          description: Workers
  /v1/workers/{worker_id}/heartbeat:
    post:
      summary: Record worker liveness and renew active execution leases
      parameters:
        - in: path
          name: worker_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active_jobs]
              properties:
                active_jobs:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActiveLease'
      responses:
        '200':
          description: Heartbeat accepted
        '400':
          description: Invalid active lease list
        '404':
          description: Worker not found
  /v1/rollouts/current:
    get:
      summary: Get the most recently configured rollout
      responses:
        '200':
          description: Current rollout configuration and status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rollout'
        '404':
          description: No rollout has been configured
  /v1/rollouts:
    post:
      summary: Configure a canary rollout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRollout'
      responses:
        '201':
          description: Rollout created
        '400':
          description: Invalid rollout request
  /v1/rollouts/rollback:
    post:
      summary: Manually roll back the active rollout
      responses:
        '200':
          description: Rollout rolled back and canary traffic set to zero
        '404':
          description: No active rollout
components:
  parameters:
    JobID:
      in: path
      name: job_id
      required: true
      schema:
        type: string
  schemas:
    CreateJob:
      type: object
      required: [tenant_id, command]
      properties:
        tenant_id:
          type: string
        idempotency_key:
          type: string
          maxLength: 128
          description: Optional when the Idempotency-Key request header is provided.
        command:
          type: string
        req_cpu:
          type: integer
          minimum: 1
          default: 1
        req_memory_mb:
          type: integer
          minimum: 1
          default: 1024
        req_gpu:
          type: integer
          minimum: 0
          default: 0
    JobStatus:
      type: object
      required: [status, worker_id, execution_id]
      properties:
        status:
          type: string
          enum: [running, succeeded, failed]
        worker_id:
          type: string
        execution_id:
          type: integer
          format: int64
        result:
          type: string
        error:
          type: string
    Worker:
      type: object
      required: [id, cpu, memory_mb, runner_version]
      properties:
        id:
          type: string
        cpu:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
        gpu:
          type: integer
          minimum: 0
          default: 0
        runner_version:
          type: string
    ActiveLease:
      type: object
      required: [job_id, execution_id]
      properties:
        job_id:
          type: string
        execution_id:
          type: integer
          format: int64
    CreateRollout:
      type: object
      required: [target_version, canary_percentage, error_threshold_pct]
      properties:
        target_version:
          type: string
          maxLength: 64
        canary_percentage:
          type: integer
          minimum: 0
          maximum: 100
        error_threshold_pct:
          type: number
          minimum: 0
          maximum: 100
    Rollout:
      allOf:
        - $ref: '#/components/schemas/CreateRollout'
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: integer
              format: int64
            status:
              type: string
              enum: [ACTIVE, ROLLED_BACK, COMPLETED]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
